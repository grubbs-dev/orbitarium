<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbitarium</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark">✦</span><div><h1>orbitarium</h1><p>the shape of your work</p></div></div>
    <div class="controls">
      <label>search <input id="search" placeholder="project, language, branch…"></label>
      <label>health <select id="health"><option value="0">all signals</option><option value="70">70+ stable</option><option value="90">90+ bright</option></select></label>
      <label>lens <select id="mode"><option value="constellation">constellation</option><option value="radar">signal radar</option><option value="orbit">orbital drift</option></select></label>
      <button id="pulse">pulse / off</button>
      <button id="live">live / off</button>
      <button id="mission">mission control</button>
      <button id="focus">focus mode</button>
    </div>
  </header>
  <main>
    <section class="stage">
      <div class="horizon"><span>horizon</span><input id="horizon" type="range" min="0" max="365" value="0"><strong id="horizon-value">now</strong></div>
      <svg id="map" viewBox="0 0 1100 680" role="img" aria-label="Repository constellation"></svg>
      <div id="event-feed" class="event-feed"><span class="event-dot"></span><span id="event-text">listening for signals…</span></div>
      <div class="legend"><span><i class="dot hot"></i> radiant</span><span><i class="dot warm"></i> cloudy</span><span><i class="dot cool"></i> eclipsed</span><span class="hint">click a star · / search · p pulse · f focus</span></div>
    </section>
    <aside id="inspector"></aside>
  </main>
  <footer><span id="summary">loading constellation…</span><span id="sky-status">reading the sky…</span><span>orbitarium / local-only / v2</span></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
