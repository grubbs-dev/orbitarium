<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbitarium</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><span class="mark">✦</span><div><h1>orbitarium</h1><p>the shape of your work</p></div></div><div class="controls"><label>search <input id="search" placeholder="project, language, branch…"></label><label>health <select id="health"><option value="0">all signals</option><option value="70">70+ stable</option><option value="90">90+ bright</option></select></label><button id="focus">focus mode</button></div></header>
<main><section class="stage"><svg id="map" viewBox="0 0 1100 680" role="img" aria-label="Repository constellation"></svg><div class="legend"><span><i class="dot hot"></i> active</span><span><i class="dot warm"></i> aging</span><span><i class="dot cool"></i> dormant</span><span class="hint">click a star · / to search · f to focus</span></div></section><aside id="inspector"><div class="empty"><span>✦</span><h2>Choose a star</h2><p>Every repository is a small world.<br>Click one to read its weather.</p></div></aside></main>
<footer><span id="summary">loading constellation…</span><span>orbitarium / local-only / v1</span></footer><script type="module">
const svg=document.querySelector('#map'), inspector=document.querySelector('#inspector'), search=document.querySelector('#search'), health=document.querySelector('#health'); let report, graph, selected;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function color(days){return days<=30?'#b9ff72':days<=180?'#ffcd70':'#8b93b7'}
function draw(){const q=search.value.toLowerCase(), min=+health.value; const visible=report.repos.filter(r=>(!q||[r.name,r.relativePath,r.branch,...r.languages.map(l=>l.name)].join(' ').toLowerCase().includes(q))&&r.health>=min); const ids=new Set(visible.map(r=>r.id)); svg.innerHTML=`<defs><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="space"><stop stop-color="#171b3c"/><stop offset="1" stop-color="#080a19"/></radialGradient></defs><rect width="1100" height="680" fill="url(#space)"/>`;
 report.links.filter(l=>ids.has(l.source)&&ids.has(l.target)).forEach(l=>{let a=graph.nodes.find(n=>n.id===l.source),b=graph.nodes.find(n=>n.id===l.target);svg.insertAdjacentHTML('beforeend',`<line class="link" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${1+l.weight*1.5}"/><text class="link-label" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}">${esc(l.shared.join(' · '))}</text>`)});
 visible.forEach(r=>{const n=graph.nodes.find(n=>n.id===r.id); const active=selected?.id===r.id; svg.insertAdjacentHTML('beforeend',`<g class="node ${active?'selected':''}" tabindex="0" data-id="${esc(r.id)}" transform="translate(${n.x},${n.y})"><circle class="halo" r="${n.radius+8}" fill="${color(r.lastCommitDays)}" opacity=".08"/><circle class="star" r="${n.radius}" fill="${color(r.lastCommitDays)}" filter="${r.health>85?'url(#glow)':''}"/><text class="node-name" y="${n.radius+22}">${esc(r.name)}</text><text class="node-score" y="5">${r.health}</text></g>`)}); document.querySelectorAll('.node').forEach(el=>el.onclick=()=>select(report.repos.find(r=>r.id===el.dataset.id))); document.querySelector('#summary').textContent=`${visible.length} of ${report.repos.length} worlds · ${report.links.length} bridges · ${report.root}`; }
function select(r){selected=r; inspector.innerHTML=`<div class="card"><div class="eyebrow">repository / ${esc(r.relativePath)}</div><h2>${esc(r.name)}</h2><div class="score" style="--score:${r.health}%"><strong>${r.health}</strong><span>signal strength</span></div><dl><dt>branch</dt><dd>${esc(r.branch)}</dd><dt>commits</dt><dd>${r.commitCount.toLocaleString()}</dd><dt>last pulse</dt><dd>${r.lastCommitDays>9000?'unknown':r.lastCommitDays+' days ago'}</dd><dt>footprint</dt><dd>${r.fileCount.toLocaleString()} files · ${(r.bytes/1024).toFixed(1)} KB</dd></dl><h3>languages</h3><div class="chips">${r.languages.map(l=>`<span>${esc(l.name)} <b>${l.files}</b></span>`).join('')||'<span>unclassified</span>'}</div><h3>signals</h3><p class="signals">${r.hasReadme?'✦ has a README':'○ missing a README'} · ${r.manifests.length?esc(r.manifests.join(', ')):'no manifest detected'}</p><button class="clear" onclick="selected=null;draw()">return to sky</button></div>`; draw();}
async function init(){report=await fetch('/api/report').then(r=>r.json()); graph={nodes:report.repos.map((r,i)=>({...r,x:550+Math.cos(i/Math.max(1,report.repos.length)*Math.PI*2)*220+(i%3)*55,y:340+Math.sin(i/Math.max(1,report.repos.length)*Math.PI*2)*220,radius:12+Math.min(34,Math.sqrt(r.fileCount+1)*4)}))}; draw();} search.oninput=draw;health.onchange=draw;document.querySelector('#focus').onclick=()=>document.body.classList.toggle('focus');document.onkeydown=e=>{if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus()}if(e.key.toLowerCase()==='f')document.body.classList.toggle('focus')};init();
</script></body></html>
